{% extends 'base.html' %}

{% block title %}{{ title }}{% endblock %}

{% block content %}
<div class="row">
    <div class="col-md-8 offset-md-2">
        <h2>{{ profile_user.username }}'s {{ title }}</h2>
        <hr>
        {% if users %}
            <ul class="list-group">
                {% for user in users %}
                    <li class="list-group-item">
                        <a href="{% url 'profile' user.username %}">{{ user.username }}</a>
                    </li>
                {% endfor %}
            </ul>
        {% else %}
            <p>No {{ title|lower }} yet.</p>
        {% endif %}
    </div>
</div>
{% endblock %}
