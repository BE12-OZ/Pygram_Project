<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Find Username Result</title>
</head>
<body>
    <h2>Find Username Result</h2>
    {% if username %}
        <p>Your username is: {{ username }}</p>
    {% else %}
        <p>No user found with that email address.</p>
    {% endif %}
    <a href="{% url 'login' %}">Login</a>
</body>
</html>
