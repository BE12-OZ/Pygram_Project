{% extends 'base.html' %}
{% load socialaccount %}

{% block title %}Login{% endblock %}

{% block content %}
<div class="row">
    <div class="col-md-6 offset-md-3">
        <h2>Login</h2>
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn btn-primary">Login</button>
        </form>
        <hr>
        <h4>Social Login</h4>
        <a href="{% provider_login_url 'naver' %}" class="btn btn-success">Naver Login</a>
        <a href="{% provider_login_url 'google' %}" class="btn btn-danger">Google Login</a>
        <a href="{% provider_login_url 'github' %}" class="btn btn-dark">GitHub Login</a>
        <a href="{% provider_login_url 'kakao' %}" class="btn btn-warning">Kakao Login</a>
    </div>
</div>
{% endblock %}
