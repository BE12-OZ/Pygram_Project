{% extends 'base.html' %}

{% block title %}{% if post %}Edit Post{% else %}Create Post{% endif %}{% endblock %}

{% block content %}
<div class="row">
    <div class="col-md-8 offset-md-2">
        <h2>{% if post %}Edit Post{% else %}Create Post{% endif %}</h2>
        <form method="post" enctype="multipart/form-data">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn btn-primary">{% if post %}Update{% else %}Create{% endif %}</button>
        </form>
    </div>
</div>
{% endblock %}
